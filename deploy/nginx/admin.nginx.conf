# 管理后台容器专用 nginx 配置
# 仅负责托管 art-design-pro 静态产物（挂在 /admin/ 子路径）
# 站点级反向代理由公共 nginx 容器（nginx.conf）承担
server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  root /usr/share/nginx/html;

  # /admin/ -> 静态产物（SPA history 模式回退到 index.html）
  location = /admin {
    return 301 /admin/;
  }
  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  # 根路径重定向到后台
  location = / {
    return 301 /admin/;
  }
}
