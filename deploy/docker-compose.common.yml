# 公共基础设施编排（仅 nginx；mysql / redis 由 1Panel 管理）
# 用法:
#   1) cp deploy/.env.deploy.example deploy/.env.deploy  并按实际修改
#   2) docker compose --env-file deploy/.env.deploy -f deploy/docker-compose.common.yml up -d
#
# 数据库与缓存使用 1Panel 管理的外部容器（1Panel-mysql-Blf7 / 1Panel-redis-VR85），
# 通过 1panel-network 外部网络与应用服务互通。本文件只启动站点级 nginx，
# 必须先启动本文件，再启动应用服务（deploy/docker-compose.services.yml）。

name: xlt-blog

networks:
  1panel-network:
    name: ${NETWORK_NAME:-1panel-network}
    external: true

services:
  # ============ Nginx（站点入口/反向代理）============
  # 公共 nginx：对外 80 端口，反代 /admin/ -> admin:80、/api/ -> server:3000、/ -> web:3001
  # 配置文件以只读卷挂载，改配置无需重建镜像，`nginx -s reload` 即可生效。
  nginx:
    image: nginx:alpine
    container_name: xlt-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # 如需 HTTPS，取消注释并准备证书
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - 1panel-network
    # nginx 反代上游（server/web/admin）由应用服务提供，跨文件无法 depends_on；
    # 上游未就绪时请求返回 502，随应用启动自动恢复（restart 兜底）。
