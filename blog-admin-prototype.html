<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greenroom Admin · 个人博客后台原型</title>
  <link rel="stylesheet" href="file:///Users/weipengcheng/.trae/design_libraries/dl_builtin_trae/colors_and_type.css">
  <link rel="stylesheet" href="file:///Users/weipengcheng/.trae/design_libraries/dl_builtin_trae/components.css">
  <style>
    :root {
      --radius-4: 4px; --radius-6: 6px; --radius-8: 8px;
      --spacer-4: 4px; --spacer-6: 6px; --spacer-8: 8px; --spacer-12: 12px; --spacer-16: 16px; --spacer-24: 24px; --spacer-32: 32px;
      --font-family-default: "SF Pro Text", system-ui, -apple-system, sans-serif;
      --font-family-heading: "SF Pro", system-ui, -apple-system, sans-serif;
      --font-family-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --bg-base-default: #1A1B1D; --bg-base-secondary: #222427; --bg-base-tertiary: #2A2D31;
      --bg-overlay-l1: rgba(224,226,242,.04); --bg-overlay-l2: rgba(224,226,242,.06); --bg-overlay-l3: rgba(224,226,242,.08); --bg-overlay-l4: rgba(224,226,242,.12);
      --bg-brand: #32F08C; --bg-brand-hover: #0FDC78;
      --text-default: #D1D3DB; --text-secondary: #9599A6; --text-tertiary: #666B75; --text-onbrand: #0C0C0D;
      --border-neutral-l1: rgba(224,226,242,.1); --border-neutral-l2: rgba(224,226,242,.16); --border-neutral-l3: rgba(224,226,242,.2);
      --status-primary-default: #387BFF; --status-success-default: #33C192; --status-warning-default: #D27E24; --status-error-default: #F65A5A;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg-base-default); color: var(--text-default); }
    body { font-family: var(--font-family-default), system-ui, -apple-system, sans-serif; font-size: 13px; line-height: 1.5; }
    button, input, select, textarea { font: inherit; }
    img { display: block; }
    .icon { width: 15px; height: 15px; object-fit: contain; }
    .icon--muted { opacity: .72; }
    .mono { font-family: var(--font-family-mono), ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .clickable { cursor: pointer; }

    /* Login */
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg-base-default); }
    .login-frame { width: min(440px, 100%); }
    .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 42px; color: var(--text-default); }
    .login-brand__mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--bg-brand); border-radius: var(--radius-8); background: var(--bg-brand); }
    .login-brand__mark img { width: 17px; height: 17px; }
    .login-brand__name { font-family: var(--font-family-heading); font-weight: 600; letter-spacing: -.02em; font-size: 16px; }
    .login-brand__env { color: var(--text-tertiary); font-family: var(--font-family-mono); font-size: 10px; margin-left: 2px; }
    .login-card { padding: 32px; background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l2); border-radius: var(--radius-8); }
    .login-card h1 { font-family: var(--font-family-heading); font-size: 28px; letter-spacing: -.04em; margin: 0 0 8px; color: #F5F9FE; }
    .login-card__sub { color: var(--text-secondary); margin: 0 0 28px; }
    .login-form { display: grid; gap: 16px; }
    .field { display: grid; gap: 7px; }
    .field label { color: var(--text-secondary); font-size: 12px; font-weight: 500; }
    .field__control { height: 36px; width: 100%; padding: 0 12px; border: 1px solid var(--border-neutral-l2); border-radius: var(--radius-4); background: var(--bg-overlay-l1); color: var(--text-default); outline: none; }
    .field__control:focus { border-color: var(--bg-brand); background: var(--bg-overlay-l2); }
    .login-password { position: relative; }
    .login-password .field__control { padding-right: 42px; }
    .password-toggle { position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border: 0; border-radius: var(--radius-4); background: transparent; display: grid; place-items: center; cursor: pointer; }
    .password-toggle:hover { background: var(--bg-overlay-l2); }
    .login-submit { width: 100%; height: 36px; margin-top: 4px; }
    .login-message { display: flex; align-items: flex-start; gap: 8px; min-height: 0; padding: 0; font-size: 12px; }
    .login-message.is-error { color: var(--status-error-default); }
    .login-message.is-success { color: var(--status-success-default); }
    .login-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; color: var(--text-tertiary); font-size: 11px; }
    .login-footer a { color: var(--text-secondary); text-decoration: none; }
    .login-footer a:hover { color: var(--bg-brand); }

    /* Shell */
    .app-shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; background: var(--bg-base-default); }
    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 16px 12px 12px; background: #202123; border-right: 1px solid var(--border-neutral-l1); transition: width .18s ease, padding .18s ease; overflow: hidden; }
    .sidebar__brand { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px; margin-bottom: 26px; white-space: nowrap; }
    .sidebar__mark { width: 24px; height: 24px; display: grid; place-items: center; background: var(--bg-brand); border-radius: var(--radius-6); flex: 0 0 24px; }
    .sidebar__mark img { width: 13px; height: 13px; }
    .sidebar__brand-name { font-family: var(--font-family-heading); font-size: 14px; font-weight: 600; color: var(--text-default); letter-spacing: -.01em; }
    .sidebar__version { margin-left: auto; font-size: 10px; color: var(--text-tertiary); font-family: var(--font-family-mono); }
    .sidebar__nav { flex: 1; overflow-y: auto; }
    .ds-navlist { width: 100%; padding: 0; background: transparent; border: 0; border-radius: 0; gap: 16px; }
    .ds-navlist__group { gap: 3px; }
    .ds-navlist__group-title { padding: 7px 8px 6px; font-size: 10px; }
    .ds-navlist__item { min-height: 32px; padding: 7px 8px; border-radius: var(--radius-4); font-size: 12px; }
    .ds-navlist__item.is-active { color: var(--text-onbrand); }
    .nav-icon { width: 15px; height: 15px; opacity: .75; flex: 0 0 15px; }
    .ds-navlist__item.is-active .nav-icon { opacity: 1; filter: brightness(0); }
    .sidebar__bottom { padding-top: 12px; border-top: 1px solid var(--border-neutral-l1); }
    .user-mini { display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: var(--radius-4); cursor: pointer; }
    .user-mini:hover { background: var(--bg-overlay-l2); }
    .user-mini__meta { min-width: 0; flex: 1; }
    .user-mini__name { color: var(--text-default); font-size: 12px; font-weight: 500; }
    .user-mini__role { color: var(--text-tertiary); font-family: var(--font-family-mono); font-size: 10px; }
    .workspace { min-width: 0; display: flex; flex-direction: column; }
    .topbar { height: 56px; flex: 0 0 56px; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid var(--border-neutral-l1); background: var(--bg-base-default); }
    .topbar__mobile-menu { display: none; }
    .breadcrumb { display: flex; align-items: center; gap: 7px; color: var(--text-tertiary); font-size: 12px; white-space: nowrap; }
    .breadcrumb strong { color: var(--text-default); font-weight: 500; }
    .breadcrumb .slash { color: var(--border-neutral-l3); }
    .topbar__search { width: min(320px, 32vw); margin-left: auto; }
    .topbar__search .ds-input { height: 32px; border-radius: var(--radius-4); }
    .topbar__search kbd { margin-left: auto; }
    .topbar__actions { display: flex; align-items: center; gap: 4px; }
    .topbar-icon { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: var(--radius-4); background: transparent; cursor: pointer; }
    .topbar-icon:hover { background: var(--bg-overlay-l2); }
    .topbar__status { display: inline-flex; align-items: center; gap: 6px; padding-left: 10px; margin-left: 6px; border-left: 1px solid var(--border-neutral-l1); color: var(--text-tertiary); font-size: 11px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--status-success-default); }
    .main-content { width: 100%; max-width: 1360px; margin: 0 auto; padding: 0 32px 48px; }
    .content-view { min-width: 0; }

    /* Shared page patterns */
    .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 30px 0 24px; border-bottom: 1px solid var(--border-neutral-l1); }
    .pagehead__eyebrow { margin-bottom: 7px; color: var(--bg-brand); font-family: var(--font-family-mono); font-size: 10px; letter-spacing: .08em; }
    .pagehead h1 { margin: 0; font-family: var(--font-family-heading); color: #F5F9FE; font-size: 25px; line-height: 1.15; letter-spacing: -.035em; }
    .pagehead p { margin: 8px 0 0; color: var(--text-secondary); font-size: 12px; }
    .pagehead__actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-icon-text { display: inline-flex; align-items: center; gap: 7px; }
    .surface { background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-6); }
    .surface__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; border-bottom: 1px solid var(--border-neutral-l1); }
    .surface__title { margin: 0; color: var(--text-default); font-size: 13px; font-weight: 600; }
    .surface__meta { color: var(--text-tertiary); font-size: 11px; }
    .section-gap { margin-top: 24px; }
    .view-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
    .mini-link { color: var(--text-secondary); font-size: 11px; text-decoration: none; }
    .mini-link:hover { color: var(--bg-brand); }
    .empty-note { padding: 28px 16px; text-align: center; color: var(--text-tertiary); font-size: 12px; }
    .chart { height: 116px; padding: 14px 16px 10px; display: flex; align-items: flex-end; gap: 9px; }
    .chart__bar { position: relative; flex: 1; min-width: 10px; height: var(--h); background: var(--bg-overlay-l3); border-top: 2px solid var(--bg-brand); border-radius: 2px 2px 0 0; }
    .chart__bar::after { content: attr(data-day); position: absolute; top: calc(100% + 7px); left: 50%; transform: translateX(-50%); color: var(--text-tertiary); font-family: var(--font-family-mono); font-size: 9px; }
    .chart__bar:nth-child(2n) { border-top-color: var(--status-primary-default); }
    .stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
    .ds-statcard { min-width: 0; padding: 16px; border-radius: var(--radius-6); }
    .ds-statcard__value { font-size: 24px; }
    .stat-label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .stat-label .icon { opacity: .52; }
    .stat-caption { color: var(--text-tertiary); font-size: 11px; }
    .activity-list { display: grid; }
    .activity-row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-neutral-l1); }
    .activity-row:last-child { border-bottom: 0; }
    .activity-row__text { min-width: 0; color: var(--text-secondary); font-size: 12px; }
    .activity-row__text strong { color: var(--text-default); font-weight: 500; }
    .activity-row__time { color: var(--text-tertiary); font-family: var(--font-family-mono); font-size: 10px; white-space: nowrap; }
    .avatar-green { background: var(--bg-brand); color: var(--text-onbrand); }
    .avatar-blue { background: rgba(56,123,255,.25); color: #80C1FF; }
    .avatar-amber { background: rgba(210,126,36,.22); color: #D78B28; }
    .article-title { display: flex; align-items: center; gap: 8px; }
    .article-title strong { font-weight: 500; color: var(--text-default); }
    .article-meta { margin-top: 3px; color: var(--text-tertiary); font-size: 11px; }
    .article-meta .mono { color: var(--text-secondary); }
    .table-actions { display: flex; gap: 4px; justify-content: flex-end; }
    .table-row-clickable { cursor: pointer; }
    .table-row-clickable:hover td { background: var(--bg-overlay-l1); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border-neutral-l1); }
    .toolbar__left, .toolbar__right { display: flex; align-items: center; gap: 8px; }
    .toolbar .ds-input { width: 230px; }
    .toolbar .ds-select { width: 130px; }
    .table-wrap { overflow: auto; }
    .ds-table-wrap { border-radius: var(--radius-6); }
    .ds-table th, .ds-table td { white-space: nowrap; }
    .ds-table td:first-child { white-space: normal; }
    .table-foot { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-top: 1px solid var(--border-neutral-l1); color: var(--text-tertiary); font-size: 11px; }
    .tag-set { display: flex; gap: 5px; flex-wrap: wrap; }

    /* Comments */
    .comments-layout { position: relative; }
    .comments-tabs { padding: 0 16px; }
    .comments-tabs .ds-tabs { gap: 22px; }
    .comments-tabs .ds-tab { padding: 13px 0; }
    .comment-cell { display: flex; align-items: flex-start; gap: 10px; min-width: 290px; }
    .comment-cell__body { min-width: 0; }
    .comment-cell__author { display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--text-default); }
    .comment-cell__excerpt { margin-top: 3px; color: var(--text-secondary); max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .comment-row.is-selected td { background: var(--bg-overlay-l2); }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.36); display: flex; justify-content: flex-end; }
    .comment-drawer { width: min(420px, 100vw); height: 100%; background: var(--bg-base-secondary); border-left: 1px solid var(--border-neutral-l2); display: flex; flex-direction: column; animation: drawer-in .18s ease-out; }
    @keyframes drawer-in { from { transform: translateX(20px); opacity: .3; } to { transform: translateX(0); opacity: 1; } }
    .comment-drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border-neutral-l1); }
    .comment-drawer__head h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .comment-drawer__body { flex: 1; overflow: auto; padding: 20px; }
    .comment-drawer__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border-neutral-l1); }
    .detail-block { margin-bottom: 22px; }
    .detail-label { margin-bottom: 8px; color: var(--text-tertiary); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .comment-quote { padding: 12px; border-left: 2px solid var(--bg-brand); background: var(--bg-overlay-l1); color: var(--text-default); line-height: 1.7; }
    .detail-pair { display: grid; grid-template-columns: 82px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border-neutral-l1); font-size: 12px; }
    .detail-pair span:first-child { color: var(--text-tertiary); }
    .detail-pair span:last-child { color: var(--text-secondary); }

    /* Taxonomy */
    .taxonomy-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; margin-top: 24px; }
    .taxonomy-list { padding: 8px; }
    .taxonomy-row { display: grid; grid-template-columns: minmax(0,1fr) 70px 88px; align-items: center; gap: 12px; min-height: 54px; padding: 8px; border-bottom: 1px solid var(--border-neutral-l1); }
    .taxonomy-row:last-child { border-bottom: 0; }
    .taxonomy-row:hover { background: var(--bg-overlay-l1); }
    .taxonomy-name { display: flex; align-items: center; gap: 9px; color: var(--text-default); font-weight: 500; }
    .taxonomy-name .icon { color: var(--text-tertiary); }
    .taxonomy-desc { color: var(--text-tertiary); font-size: 11px; margin-top: 2px; }
    .taxonomy-count { color: var(--text-secondary); font-family: var(--font-family-mono); font-size: 11px; text-align: right; }
    .editor-card { padding: 20px; }
    .editor-card h2 { margin: 0 0 18px; font-size: 15px; }
    .editor-form { display: grid; gap: 14px; }
    .editor-form .field__control { height: 34px; }
    .editor-form textarea.field__control { height: 82px; padding: 9px 12px; resize: vertical; }
    .editor-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 6px; }
    .color-row { display: flex; align-items: center; gap: 8px; }
    .color-chip { width: 20px; height: 20px; border-radius: var(--radius-4); background: var(--bg-brand); border: 1px solid var(--border-neutral-l2); }

    /* Attachments */
    .attachment-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
    .attachment-toolbar__meta { color: var(--text-secondary); }
    .view-toggle { display: inline-flex; border: 1px solid var(--border-neutral-l2); border-radius: var(--radius-4); overflow: hidden; }
    .view-toggle button { width: 31px; height: 28px; border: 0; border-right: 1px solid var(--border-neutral-l1); background: transparent; display: grid; place-items: center; cursor: pointer; }
    .view-toggle button:last-child { border-right: 0; }
    .view-toggle button.is-active { background: var(--bg-overlay-l3); color: var(--text-default); }
    .attachment-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .attachment-card { overflow: hidden; background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-6); cursor: pointer; }
    .attachment-card:hover { border-color: var(--border-neutral-l3); }
    .attachment-thumb { height: 132px; display: grid; place-items: center; color: var(--text-tertiary); background: var(--bg-base-tertiary); border-bottom: 1px solid var(--border-neutral-l1); }
    .thumb-art { width: 100%; height: 100%; position: relative; overflow: hidden; background: #2c3333; }
    .thumb-art::before { content: ""; position: absolute; width: 76px; height: 76px; border-radius: 50%; background: var(--bg-brand); left: 22px; top: 24px; opacity: .86; }
    .thumb-art::after { content: ""; position: absolute; width: 150px; height: 60px; transform: rotate(-25deg); background: #15382c; right: -26px; bottom: 18px; }
    .thumb-art--blue { background: #203040; }
    .thumb-art--blue::before { background: #80C1FF; left: 38px; top: 34px; }
    .thumb-art--amber { background: #393226; }
    .thumb-art--amber::before { background: #D78B28; width: 96px; height: 58px; border-radius: 3px; left: 26px; top: 34px; }
    .thumb-art--ink { background: #292d35; }
    .thumb-art--ink::before { width: 110px; height: 110px; background: #5d6e8f; left: 68px; top: -20px; opacity: .65; }
    .attachment-info { padding: 10px; }
    .attachment-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text-default); }
    .attachment-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; color: var(--text-tertiary); font-family: var(--font-family-mono); font-size: 10px; }
    .attachment-list { display: grid; }
    .attachment-list .attachment-card { display: grid; grid-template-columns: 64px minmax(0,1fr) 100px 88px; gap: 12px; align-items: center; padding: 8px; border-radius: 0; border-width: 0 0 1px; }
    .attachment-list .attachment-card:last-child { border-bottom: 0; }
    .attachment-list .attachment-thumb { width: 64px; height: 48px; border: 0; }
    .attachment-list .attachment-info { padding: 0; }
    .attachment-list .attachment-meta { margin: 0; display: block; }
    .attachment-list .attachment-meta span + span { display: block; margin-top: 2px; }

    /* Settings */
    .settings-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 32px; margin-top: 24px; align-items: start; }
    .settings-menu { position: sticky; top: 80px; display: grid; gap: 3px; }
    .settings-menu button { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border: 0; border-radius: var(--radius-4); background: transparent; color: var(--text-secondary); text-align: left; cursor: pointer; }
    .settings-menu button:hover, .settings-menu button.is-active { background: var(--bg-overlay-l2); color: var(--text-default); }
    .settings-menu button.is-active { box-shadow: inset 2px 0 0 var(--bg-brand); }
    .settings-panel { display: grid; gap: 24px; }
    .settings-group { display: grid; gap: 10px; }
    .settings-group__label { padding-left: 4px; color: var(--text-secondary); font-size: 12px; font-weight: 500; }
    .ds-settingrow__panel { border-radius: var(--radius-6); }
    .ds-settingrow { padding: 15px 18px; }
    .ds-settingrow__select { min-width: 150px; height: 32px; border-radius: var(--radius-4); }
    .settings-input { width: 220px; height: 32px; }
    .settings-savebar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding-top: 4px; }
    .save-status { color: var(--status-success-default); font-size: 11px; opacity: 0; transition: opacity .15s; }
    .save-status.is-visible { opacity: 1; }
    .danger-zone { border-color: rgba(246,90,90,.28); }
    .danger-zone .ds-settingrow__title { color: var(--status-error-default); }

    /* Article create state */
    .create-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; margin-top: 16px; border: 1px solid rgba(50,240,140,.28); background: var(--bg-brand-popup, rgba(50,240,140,.12)); border-radius: var(--radius-6); }
    .create-banner__text { color: var(--text-default); }
    .create-banner__text span { display: block; color: var(--text-secondary); font-size: 11px; margin-top: 2px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 30; display: flex; align-items: center; gap: 9px; padding: 11px 14px; color: var(--text-default); background: var(--bg-base-tertiary); border: 1px solid var(--border-neutral-l2); border-radius: var(--radius-4); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .18s, transform .18s; }
    .toast.is-visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 980px) {
      .app-shell { grid-template-columns: 72px minmax(0,1fr); }

    views.comments = () => pagehead('COMMUNITY / 03', '评论', '集中处理读者反馈，保持讨论区健康有序。', button('批量处理','secondary','','check')) + `<div class="surface section-gap comments-layout"><div class="comments-tabs"><div class="ds-tabs ds-tabs--filled" data-comment-tabs><button class="ds-tab is-active" data-comment-status="all">全部 <span class="ds-tag ds-tag--count">18</span></button><button class="ds-tab" data-comment-status="pending">待审核 <span class="ds-tag ds-tag--count">7</span></button><button class="ds-tab" data-comment-status="approved">已通过 <span class="ds-tag ds-tag--count">10</span></button><button class="ds-tab" data-comment-status="spam">垃圾评论 <span class="ds-tag ds-tag--count">1</span></button></div></div><div class="table-wrap"><table class="ds-table"><thead><tr><th>评论</th><th>文章</th><th>状态</th><th>时间</th><th></th></tr></thead><tbody><tr class="comment-row table-row-clickable" data-status="pending"><td><div class="comment-cell"><span class="ds-avatar ds-avatar--sm avatar-blue">陈</span><div class="comment-cell__body"><div class="comment-cell__author">陈默 ${statusTag('新','brand')}</div><div class="comment-cell__excerpt">这个拆解非常清楚，尤其是关于边界和默认值的部分。准备在下一个项目里试试。</div></div></div></td><td>从 0 到 1 构建内容系统</td><td>${statusTag('待审核','warning')}</td><td class="text-secondary">12 分钟前</td><td><button class="ds-btn ds-btn--tertiary ds-btn--icon js-open-comment">${icon('chevron-right')}</button></td></tr><tr class="comment-row table-row-clickable" data-status="pending"><td><div class="comment-cell"><span class="ds-avatar ds-avatar--sm avatar-amber">K</span><div class="comment-cell__body"><div class="comment-cell__author">kevin.z</div><div class="comment-cell__excerpt">请问这个方案在多租户场景下还适用吗？</div></div></div></td><td>把复杂留给系统</td><td>${statusTag('待审核','warning')}</td><td class="text-secondary">1 小时前</td><td><button class="ds-btn ds-btn--tertiary ds-btn--icon js-open-comment">${icon('chevron-right')}</button></td></tr><tr class="comment-row table-row-clickable" data-status="approved"><td><div class="comment-cell"><span class="ds-avatar ds-avatar--sm avatar-green">A</span><div class="comment-cell__body"><div class="comment-cell__author">安然</div><div class="comment-cell__excerpt">已收藏，感谢分享。</div></div></div></td><td>我的开发者工具箱</td><td>${statusTag('已通过','success')}</td><td class="text-secondary">昨天 18:22</td><td><button class="ds-btn ds-btn--tertiary ds-btn--icon js-open-comment">${icon('chevron-right')}</button></td></tr><tr class="comment-row table-row-clickable" data-status="approved"><td><div class="comment-cell"><span class="ds-avatar ds-avatar--sm avatar-blue">M</span><div class="comment-cell__body"><div class="comment-cell__author">Mia</div><div class="comment-cell__excerpt">很喜欢最后一段关于长期主义的表达。</div></div></div></td><td>写给新一代创作者的信</td><td>${statusTag('已通过','success')}</td><td class="text-secondary">昨天 14:06</td><td><button class="ds-btn ds-btn--tertiary ds-btn--icon js-open-comment">${icon('chevron-right')}</button></td></tr><tr class="comment-row table-row-clickable" data-status="spam"><td><div class="comment-cell"><span class="ds-avatar ds-avatar--sm">?</span><div class="comment-cell__body"><div class="comment-cell__author">guest_291</div><div class="comment-cell__excerpt">点击这里领取免费资源，立即参与活动……</div></div></div></td><td>从 0 到 1 构建内容系统</td><td>${statusTag('垃圾评论','danger')}</td><td class="text-secondary">8 月 05 日</td><td><button class="ds-btn ds-btn--tertiary ds-btn--icon js-open-comment">${icon('chevron-right')}</button></td></tr></tbody></table></div><div class="table-foot"><span>显示 1–5 / 18 条评论</span><div class="ds-pagination"><button class="ds-pagination__item is-active">1</button><button class="ds-pagination__item">2</button><button class="ds-pagination__item">3</button></div></div></div>`;

    const taxonomyView = (type) => { const cats = type === 'categories'; return pagehead('CONTENT STRUCTURE / '+(cats?'04':'05'), cats?'分类':'标签', cats?'用分类组织内容的主题与层级。':'为文章添加可检索的主题关键词。', button(cats?'新建分类':'新建标签','brand','js-new-taxonomy','plus')) + `<div class="taxonomy-layout"><section class="surface"><div class="surface__head"><div><h2 class="surface__title">${cats?'全部分类':'全部标签'}</h2><div class="surface__meta">${cats?'4 个分类 · 24 篇文章':'12 个标签 · 已关联 31 篇文章'}</div></div><div class="ds-input" style="width:190px"><img class="icon ds-input__icon" src="${ICON}search.svg" alt=""><input placeholder="搜索…"></div></div><div class="taxonomy-list">${(cats?[['产品','关于产品设计、策略与增长','12'],['工具','开发工具与工作流实践','6'],['思考','关于工作与生活的思考','4'],['随笔','不定期的记录与片段','2']]:[['design-system','设计系统相关内容','8'],['workflow','工作流与效率','6'],['javascript','JavaScript 技术笔记','5'],['writing','写作方法与复盘','4'],['career','职业成长与选择','3']]).map((item,i)=>`<div class="taxonomy-row"><div><div class="taxonomy-name">${icon(cats?'folder':'hash')} ${item[0]}</div><div class="taxonomy-desc">${item[1]}</div></div><span class="taxonomy-count">${item[2]} 篇</span><button class="ds-btn ds-btn--tertiary ds-btn--sm js-taxonomy-edit">编辑</button></div>`).join('')}</div></section><aside class="surface editor-card"><h2 id="taxonomy-editor-title">${cats?'编辑分类':'编辑标签'}</h2><div class="editor-form"><div class="field"><label>名称</label><input class="field__control" value="${cats?'产品':'design-system'}"></div><div class="field"><label>Slug</label><input class="field__control mono" value="${cats?'product':'design-system'}"></div><div class="field"><label>描述</label><textarea class="field__control">${cats?'关于产品设计、策略与增长':'设计系统相关内容'}</textarea></div>${!cats?'<div class="field"><label>标签颜色</label><div class="color-row"><span class="color-chip"></span><span class="mono" style="color:var(--text-secondary)">#32F08C</span></div></div>':''}<div class="editor-actions"><button class="ds-btn ds-btn--secondary">取消</button><button class="ds-btn ds-btn--primary js-save-taxonomy">保存更改</button></div></div></aside></div>`; };
    views.categories = () => taxonomyView('categories');
    views.tags = () => taxonomyView('tags');

    views.attachments = () => pagehead('MEDIA / 06', '附件库', '管理文章中使用的图片、文档与其他媒体资源。', button('上传附件','brand','js-upload','upload')) + `<div class="attachment-toolbar"><span class="attachment-toolbar__meta">共 <strong class="text-default">32</strong> 个文件 · 已使用 128 MB / 1 GB</span><div class="view-toggle"><button id="attachment-grid-toggle" data-dom-id="attachment-grid-toggle" class="is-active" title="网格视图">${icon('grid-2x2')}</button><button id="attachment-list-toggle" title="列表视图">${icon('list')}</button></div></div><section id="attachment-library" class="surface"><div class="attachment-grid" id="attachment-grid">${[['cover-content-system','green'],['toolbox-cover','blue'],['complexity-note','amber'],['creator-letter','ink'],['avatar-lin','green'],['og-template','blue'],['reading-list','amber'],['workspace-shot','ink']].map((item,i)=>`<article class="attachment-card"><div class="attachment-thumb"><div class="thumb-art thumb-art--${item[1] === 'green'?'':item[1]}"></div></div><div class="attachment-info"><div class="attachment-name">${item[0]}.png</div><div class="attachment-meta"><span>${i%2?'1.2':'2.4'} MB</span><span>${i+2} 天前</span></div></div></article>`).join('')}</div></section>`;

    views.settings = () => pagehead('SYSTEM / 07', '系统设置', '调整站点信息、发布偏好与通知方式。', '') + `<div class="settings-layout"><nav class="settings-menu"><button class="is-active" data-setting-group="general">${icon('settings')} 通用设置</button><button data-setting-group="profile">${icon('user-circle')} 个人资料</button><button data-setting-group="notifications">${icon('bell')} 通知</button></nav><div class="settings-panel"><section class="settings-group" data-setting-panel="general"><div class="settings-group__label">基础设置</div><div class="ds-settingrow__panel"><div class="ds-settingrow"><div class="ds-settingrow__main"><div class="ds-settingrow__title">站点名称</div><div class="ds-settingrow__desc">显示在浏览器标题与站点页头。</div></div><div class="ds-settingrow__control"><input class="field__control settings-input" value="Greenroom Notes"></div></div><div class="ds-settingrow"><div class="ds-settingrow__main"><div class="ds-settingrow__title">站点地址</div><div class="ds-settingrow__desc">你的公开博客 URL。</div></div><div class="ds-settingrow__control"><input class="field__control settings-input mono" value="https://greenroom.dev"></div></div><div class="ds-settingrow"><div class="ds-settingrow__main"><div class="ds-settingrow__title">默认语言</div><div class="ds-settingrow__desc">后台与新文章的默认语言。</div></div><div class="ds-settingrow__control"><select class="ds-select ds-settingrow__select"><option>简体中文</option><option>English</option></select></div></div></div></section><section class="settings-group" data-setting-panel="profile"><div class="settings-group__label">个人资料</div><div class="ds-settingrow__panel"><div class="ds-settingrow"><div class="ds-settingrow__main"><div class="ds-settingrow__title">显示名称</div><div class="ds-settingrow__desc">文章作者与评论回复中显示的名称。</div></div><div class="ds-settingrow__control"><input class="field__control settings-input" value="林晓特"></div></div><div class="ds-settingrow"><div class="ds-settingrow__main"><div class="ds-settingrow__title">个人简介</div><div class="ds-settingrow__desc">一行简短的介绍，显示在作者卡片。</div></div><div class="ds-settingrow__control"><input class="field__control settings-input" value="独立开发者 · 写作者"></div></div></div></section><section class="settings-group" data-setting-panel="notifications"><div class="settings-group__label">通知偏好</div><div class="ds-settingrow__panel"><div class="ds-settingrow"><div class="ds-settingrow__main"><div class="ds-settingrow__title">新评论提醒</div><div class="ds-settingrow__desc">有新评论等待审核时发送邮件提醒。</div></div><div class="ds-settingrow__control"><label class="ds-switch"><input type="checkbox" checked><span class="ds-switch__thumb"></span></label></div></div><div class="ds-settingrow"><div class="ds-settingrow__main"><div class="ds-settingrow__title">每周数据摘要</div><div class="ds-settingrow__desc">每周一发送上周的访问与订阅数据。</div></div><div class="ds-settingrow__control"><label class="ds-switch"><input type="checkbox" checked><span class="ds-switch__thumb"></span></label></div></div></div></section><div class="settings-savebar"><span id="settings-save-status" class="save-status">设置已保存</span><button id="settings-save" data-dom-id="settings-save" class="ds-btn ds-btn--primary">保存设置</button></div></div></div>`;

    function renderView(name='dashboard') { const viewName = views[name] ? name : 'dashboard'; content.innerHTML = views[viewName](); breadcrumb.textContent = ({dashboard:'概览',articles:'文章',comments:'评论',categories:'分类',tags:'标签',attachments:'附件库',settings:'系统设置'})[viewName]; document.querySelectorAll('[data-view]').forEach(el => el.classList.toggle('is-active', el.dataset.view === viewName)); bindView(viewName); window.scrollTo(0, 0); }
    function bindView(viewName) {
      document.querySelectorAll('[data-view]').forEach(el => el.onclick = e => { e.preventDefault(); renderView(el.dataset.view); history.replaceState(null, '', '#'+el.dataset.view); });
      document.querySelectorAll('.js-create-article').forEach(btn => btn.onclick = () => { renderView('articles'); setTimeout(() => { document.querySelector('#article-create-state')?.classList.remove('hidden'); document.querySelector('#article-create-state')?.scrollIntoView({block:'center'}); }, 0); });
      document.querySelectorAll('.js-close-create').forEach(btn => btn.onclick = () => document.querySelector('#article-create-state')?.classList.add('hidden'));
      document.querySelectorAll('.js-edit').forEach(btn => btn.onclick = () => showToast('已进入文章编辑状态'));
      document.querySelectorAll('.js-open-comment').forEach(btn => btn.onclick = () => openDrawer(btn.closest('.comment-row')));
      document.querySelectorAll('[data-comment-status]').forEach(tab => tab.onclick = () => { document.querySelectorAll('[data-comment-status]').forEach(t => t.classList.toggle('is-active', t === tab)); document.querySelectorAll('.comment-row').forEach(row => row.classList.toggle('hidden', tab.dataset.commentStatus !== 'all' && row.dataset.status !== tab.dataset.commentStatus)); });
      document.querySelectorAll('.js-taxonomy-edit').forEach(btn => btn.onclick = () => { const name = btn.closest('.taxonomy-row').querySelector('.taxonomy-name').textContent.trim(); document.querySelector('#taxonomy-editor-title').textContent = `编辑${viewName === 'categories' ? '分类' : '标签'} · ${name}`; showToast('已加载编辑内容'); });
      document.querySelectorAll('.js-save-taxonomy').forEach(btn => btn.onclick = () => showToast('已保存更改'));
      document.querySelectorAll('.js-upload').forEach(btn => btn.onclick = () => showToast('上传面板已打开'));
      const grid = document.querySelector('#attachment-grid'); const library = document.querySelector('#attachment-library');
      document.querySelector('#attachment-grid-toggle')?.addEventListener('click', () => { grid.className = 'attachment-grid'; document.querySelector('#attachment-grid-toggle').classList.add('is-active'); document.querySelector('#attachment-list-toggle').classList.remove('is-active'); });
      document.querySelector('#attachment-list-toggle')?.addEventListener('click', () => { grid.className = 'attachment-list'; document.querySelector('#attachment-list-toggle').classList.add('is-active'); document.querySelector('#attachment-grid-toggle').classList.remove('is-active'); });
      document.querySelectorAll('[data-setting-group]').forEach(tab => tab.onclick = () => { document.querySelectorAll('[data-setting-group]').forEach(t => t.classList.toggle('is-active', t === tab)); document.querySelectorAll('[data-setting-panel]').forEach(panel => panel.classList.toggle('hidden', panel.dataset.settingPanel !== tab.dataset.settingGroup)); });
      document.querySelector('#settings-save')?.addEventListener('click', () => { document.querySelector('#settings-save-status').classList.add('is-visible'); showToast('系统设置已保存'); setTimeout(() => document.querySelector('#settings-save-status')?.classList.remove('is-visible'), 2600); });
    }
    function openDrawer(row) { const drawer = document.querySelector('#comment-drawer'); drawer.classList.remove('hidden'); drawer.setAttribute('aria-hidden','false'); document.querySelectorAll('.comment-row').forEach(r => r.classList.remove('is-selected')); row?.classList.add('is-selected'); }
    function closeDrawer() { const drawer = document.querySelector('#comment-drawer'); drawer.classList.add('hidden'); drawer.setAttribute('aria-hidden','true'); document.querySelectorAll('.comment-row').forEach(r => r.classList.remove('is-selected')); }
    document.querySelectorAll('[data-close-drawer]').forEach(btn => btn.addEventListener('click', closeDrawer));
    document.querySelector('#comment-drawer').addEventListener('click', e => { if (e.target.id === 'comment-drawer') closeDrawer(); });
    document.querySelectorAll('[data-drawer-action]').forEach(btn => btn.addEventListener('click', () => { closeDrawer(); showToast(btn.dataset.drawerAction === 'approve' ? '评论已通过' : '已标记为垃圾评论'); }));
    document.querySelector('.password-toggle').addEventListener('click', e => { const input = document.querySelector('#login-password'); const isPassword = input.type === 'password'; input.type = isPassword ? 'text' : 'password'; e.currentTarget.querySelector('img').src = ICON + (isPassword ? 'eye-off.svg' : 'eye.svg'); });
    document.querySelector('#login-form').addEventListener('submit', e => { e.preventDefault(); const message = document.querySelector('#login-message'); const password = document.querySelector('#login-password').value; if (password !== 'demo') { message.className = 'login-message is-error'; message.innerHTML = `${icon('alert-circle')}<span>密码不正确，请输入演示密码 <span class="mono">demo</span>。</span>`; return; } message.className = 'login-message is-success'; message.innerHTML = `${icon('check-circle')}<span>验证成功，正在进入控制台…</span>`; setTimeout(() => { document.querySelector('#login-screen').classList.add('hidden'); document.querySelector('#app-shell').classList.remove('hidden'); renderView(location.hash.slice(1) || 'dashboard'); }, 420); });
    document.querySelector('#forgot-password').addEventListener('click', e => { e.preventDefault(); const message = document.querySelector('#login-message'); message.className = 'login-message is-success'; message.innerHTML = `${icon('mail')}<span>重置链接已发送到你的邮箱。</span>`; });
    document.querySelector('#mobile-nav-toggle').addEventListener('click', () => document.querySelector('#sidebar').classList.toggle('is-mobile-open'));
    document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.querySelector('#global-search input')?.focus(); } if (e.key === 'Escape') closeDrawer(); });
  </script>
</body>
</html>
