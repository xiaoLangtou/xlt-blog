<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>媒体库 · Xlt Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --primary-soft:#eff6ff;
    --primary-glow:rgba(37,99,235,.15);
    --bg:#f2f4f8;
    --card:#ffffff;
    --border:#e5e7eb;
    --text:#1f2937;
    --text-soft:#6b7280;
    --text-faint:#9ca3af;
    --danger:#ef4444;
    --danger-soft:#fef2f2;
    --success:#10b981;
    --cat-image:#10b981;
    --cat-video:#8b5cf6;
    --cat-audio:#f59e0b;
    --cat-doc:#f97316;
    --cat-archive:#64748b;
    --cat-other:#ec4899;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}

  /* ===== Sidebar ===== */
  .sidebar{
    background:#fff;border-right:1px solid var(--border);
    padding:16px 0;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .logo{display:flex;align-items:center;gap:10px;padding:6px 20px 18px}
  .logo .mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,#6366f1,#2563eb);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:14px;
  }
  .logo .name{font-weight:700;font-size:15px}
  .nav{flex:1;overflow-y:auto}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 20px;color:#374151;font-size:13.5px;
    cursor:pointer;transition:background .12s;
  }
  .nav-item:hover{background:#f9fafb}
  .nav-item svg{width:16px;height:16px;flex:none;color:#9ca3af}
  .nav-group-title{font-weight:500}
  .nav-sub{padding-left:14px}
  .nav-sub .nav-item{padding-left:46px;font-size:13px;color:#4b5563}
  .nav-sub .nav-item svg{width:15px;height:15px}
  .nav-sub .nav-item.active{
    background:var(--primary-soft);color:var(--primary);
    font-weight:600;position:relative;
  }
  .nav-sub .nav-item.active svg{color:var(--primary)}
  .nav-sub .nav-item.active::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);
  }
  .nav-badge{
    margin-left:auto;font-size:10px;font-weight:600;
    background:var(--primary-soft);color:var(--primary);
    padding:1px 7px;border-radius:10px;
  }

  /* ===== Right Col ===== */
  .right-col{display:flex;flex-direction:column;min-width:0}

  /* ===== Topbar ===== */
  .topbar{
    height:56px;background:#fff;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;flex:none;position:sticky;top:0;z-index:50;
  }
  .topbar-left{display:flex;align-items:center;gap:16px;color:#6b7280}
  .topbar-left svg{width:17px;height:17px;cursor:pointer}
  .topbar-left svg:hover{color:var(--text)}
  .crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px}
  .crumbs .dim{color:var(--text-faint)}
  .crumbs .cur{color:var(--text);font-weight:600}
  .topbar-right{display:flex;align-items:center;gap:16px}
  .tb-search{
    display:flex;align-items:center;gap:8px;
    background:#f3f4f6;border-radius:8px;padding:7px 12px;
    color:var(--text-faint);font-size:12.5px;width:220px;
    transition:border-color .2s,box-shadow .2s;border:1.5px solid transparent;
  }
  .tb-search:focus-within{border-color:#93b4f5;box-shadow:0 0 0 3px var(--primary-glow);background:#fff}
  .tb-search input{border:none;background:none;outline:none;font-size:12.5px;color:var(--text);width:100%;font-family:inherit}
  .tb-search kbd{background:#fff;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--text-faint)}
  .tb-icons{display:flex;align-items:center;gap:14px;color:#6b7280}
  .tb-icons svg{width:17px;height:17px;cursor:pointer;transition:color .15s}
  .tb-icons svg:hover{color:var(--text)}
  .notif-wrap{position:relative;display:flex}
  .notif-dot{position:absolute;top:-1px;right:-1px;width:7px;height:7px;background:var(--danger);border-radius:50%;border:1.5px solid #fff}
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,#f472b6,#c026d3);
    cursor:pointer;transition:transform .15s;
  }
  .avatar:hover{transform:scale(1.08)}

  /* ===== Tab Strip ===== */
  .tabstrip{
    background:#fff;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;
    padding:8px 16px;overflow-x:auto;flex:none;
  }
  .tab-chip{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:6px;
    font-size:12.5px;color:#4b5563;
    background:#f9fafb;border:1px solid var(--border);
    white-space:nowrap;flex:none;cursor:pointer;transition:all .15s;
  }
  .tab-chip svg{width:13px;height:13px}
  .tab-chip .x{margin-left:2px;color:var(--text-faint);font-size:13px;cursor:pointer;opacity:.5}
  .tab-chip:hover{background:#f0f1f5}
  .tab-chip:hover .x{opacity:1}
  .tab-chip.active{background:var(--primary-soft);border-color:#bfdbfe;color:var(--primary);font-weight:600}

  /* ===== Content ===== */
  .content{flex:1;overflow-y:auto;padding:24px 28px 60px}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;display:flex;align-items:center;gap:14px;
    transition:box-shadow .2s,transform .2s;
    opacity:0;animation:fadeUp .5s ease forwards;
  }
  .stat-card:nth-child(1){animation-delay:.05s}
  .stat-card:nth-child(2){animation-delay:.1s}
  .stat-card:nth-child(3){animation-delay:.15s}
  .stat-card:nth-child(4){animation-delay:.2s}
  .stat-card:hover{box-shadow:0 4px 16px -6px rgba(15,23,42,.1);transform:translateY(-1px)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .stat-icon{
    width:40px;height:40px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .stat-icon svg{width:19px;height:19px}
  .stat-body .s-label{font-size:12px;color:var(--text-soft);margin-bottom:3px}
  .stat-body .s-value{font-size:19px;font-weight:700;line-height:1}
  .stat-body .s-delta{font-size:11.5px;margin-top:5px;color:#10b981}
  .stat-body .s-delta.neutral{color:var(--text-faint)}

  /* Toolbar */
  .toolbar{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    opacity:0;animation:fadeUp .5s ease forwards;animation-delay:.15s;
  }
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;
    font-size:12.5px;color:#4b5563;
    background:#f3f4f6;cursor:pointer;
    border:1.5px solid transparent;transition:all .15s;font-family:inherit;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%}
  .chip:hover{background:#e5e7eb;color:var(--text)}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .chip.active .count{color:rgba(255,255,255,.75)}
  .chip .count{color:var(--text-faint);font-size:11.5px}
  .toolbar-right{display:flex;align-items:center;gap:8px}
  .search-box{
    display:flex;align-items:center;gap:6px;
    background:#f3f4f6;border-radius:8px;padding:7px 10px;width:180px;
    border:1.5px solid transparent;transition:all .2s;
  }
  .search-box:focus-within{border-color:#93b4f5;background:#fff;box-shadow:0 0 0 3px var(--primary-glow)}
  .search-box svg{width:14px;height:14px;color:var(--text-faint);flex:none}
  .search-box input{border:none;background:none;outline:none;font-size:12.5px;width:100%;font-family:inherit;color:var(--text)}
  select{
    font-size:12.5px;border:1px solid var(--border);background:#fff;
    padding:7px 10px;border-radius:8px;color:var(--text);cursor:pointer;font-family:inherit;
  }
  .view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .view-toggle button{
    background:#fff;border:none;padding:7px 9px;cursor:pointer;
    color:var(--text-soft);transition:all .15s;
    display:flex;align-items:center;justify-content:center;
  }
  .view-toggle button.active{background:var(--primary);color:#fff}
  .view-toggle button:hover:not(.active){background:#f3f4f6;color:var(--text)}
  .view-toggle button+button{border-left:1px solid var(--border)}

  /* ===== Grid ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}

  /* Upload Card (first item in grid) */
  .upload-card{
    background:var(--card);border:2px dashed var(--border);border-radius:12px;
    min-height:200px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:all .25s;
    opacity:0;animation:cardPop .45s ease forwards;
  }
  .upload-card::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 60%,var(--primary-glow),transparent 70%);
    opacity:0;transition:opacity .3s;
  }
  .upload-card:hover{
    border-color:var(--primary);background:#fafbff;
    transform:translateY(-3px);
    box-shadow:0 8px 24px -8px rgba(15,23,42,.12);
  }
  .upload-card:hover::before{opacity:1}
  .upload-card.drag-over{
    border-color:var(--primary);background:var(--primary-soft);
    transform:translateY(-3px) scale(1.01);
  }
  .upload-card.drag-over::before{opacity:1}
  .upload-card .uc-icon{
    width:44px;height:44px;border-radius:50%;
    background:#f3f4f6;border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    position:relative;z-index:1;transition:all .25s;
  }
  .upload-card:hover .uc-icon{
    border-color:var(--primary);background:var(--primary-soft);
    transform:translateY(-2px);
    box-shadow:0 4px 12px var(--primary-glow);
  }
  .upload-card .uc-icon svg{width:18px;height:18px;color:var(--primary)}
  .upload-card .uc-text{
    font-size:13px;font-weight:600;color:var(--text-soft);
    position:relative;z-index:1;transition:color .2s;
  }
  .upload-card:hover .uc-text{color:var(--primary)}
  .upload-card .uc-hint{
    font-size:11.5px;color:var(--text-faint);
    position:relative;z-index:1;
  }

  /* File Card */
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    overflow:hidden;cursor:pointer;position:relative;
    transition:box-shadow .2s,transform .2s,border-color .2s;
    opacity:0;animation:cardPop .45s ease forwards;
  }
  .card:nth-child(1){animation-delay:.02s}
  .card:nth-child(2){animation-delay:.04s}
  .card:nth-child(3){animation-delay:.06s}
  .card:nth-child(4){animation-delay:.08s}
  .card:nth-child(5){animation-delay:.1s}
  .card:nth-child(6){animation-delay:.12s}
  .card:nth-child(7){animation-delay:.14s}
  .card:nth-child(8){animation-delay:.16s}
  .card:nth-child(9){animation-delay:.18s}
  .card:nth-child(10){animation-delay:.2s}
  .card:nth-child(11){animation-delay:.22s}
  .card:nth-child(12){animation-delay:.24s}
  .card:nth-child(13){animation-delay:.26s}
  .card:nth-child(14){animation-delay:.28s}
  .card:nth-child(15){animation-delay:.3s}
  .card:nth-child(16){animation-delay:.32s}
  .card:nth-child(17){animation-delay:.34s}
  @keyframes cardPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .card:hover{
    box-shadow:0 8px 24px -8px rgba(15,23,42,.16);
    transform:translateY(-3px);border-color:#c7d0e8;
  }
  .thumb{
    height:112px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;background:#f3f4f6;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
  .card:hover .thumb img{transform:scale(1.06)}
  .thumb .icon-wrap{
    width:44px;height:44px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;transition:transform .25s;
  }
  .card:hover .thumb .icon-wrap{transform:scale(1.1)}
  .badge{
    position:absolute;top:8px;right:8px;
    font-size:9.5px;font-weight:700;letter-spacing:.3px;
    padding:2px 6px;border-radius:5px;color:#fff;
  }
  .thumb .hover-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55) 100%);
    display:flex;align-items:flex-end;justify-content:center;
    padding:12px;opacity:0;transition:opacity .25s;
  }
  .card:hover .hover-overlay{opacity:1}
  .hover-actions{display:flex;gap:6px;width:100%}
  .hover-actions .btn-sm{
    flex:1;justify-content:center;
    background:rgba(255,255,255,.18);backdrop-filter:blur(8px);
    color:#fff;border:1px solid rgba(255,255,255,.2);
    font-size:11px;padding:5px 0;cursor:pointer;
    border-radius:6px;font-family:inherit;font-weight:600;
    transition:background .15s;
  }
  .hover-actions .btn-sm:hover{background:rgba(255,255,255,.3)}
  .card-body{padding:10px 12px 12px}
  .fname{
    font-size:13px;font-weight:600;margin-bottom:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .fsize{font-size:12px;color:var(--text-soft)}
  .fdate{font-size:11px;color:var(--text-faint)}
  .card-actions{display:flex;align-items:center;gap:12px}
  .link-btn{font-size:12px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;transition:opacity .15s}
  .link-btn.danger{color:var(--danger);font-weight:500}
  .link-btn.muted{color:var(--text-soft)}
  .link-btn:hover{text-decoration:underline}

  /* ===== List ===== */
  .list{display:none;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .list.active{display:flex}
  .grid.hidden{display:none}
  .list-row{
    display:grid;grid-template-columns:44px 1fr 90px 90px 110px 120px;
    align-items:center;gap:12px;padding:10px 16px;
    border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;transition:background .12s;
  }
  .list-row:last-child{border-bottom:none}
  .list-row:hover{background:#fafbff}
  .list-row.head{
    font-size:12px;color:var(--text-faint);background:#fafafa;
    font-weight:600;cursor:default;
  }
  .list-row.head:hover{background:#fafafa}
  .row-thumb{
    width:32px;height:32px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .row-thumb img{width:100%;height:100%;object-fit:cover}
  .row-thumb svg{width:15px;height:15px}
  .lname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell-soft{color:var(--text-soft);font-size:12.5px}
  .row-actions{display:flex;gap:12px}
  .col-hide{}
  .empty{display:none;padding:70px 20px;text-align:center;color:var(--text-soft)}
  .empty.show{display:block}
  .empty h3{margin:0 0 6px;font-size:15px;color:var(--text)}
  .empty p{margin:0;font-size:13px}

  /* ===== Detail Modal ===== */
  .detail-overlay{
    position:fixed;inset:0;z-index:200;
    background:rgba(0,0,0,.45);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;
  }
  .detail-overlay.visible{display:flex}
  .detail-panel{
    background:#fff;border:1px solid var(--border);border-radius:14px;
    width:620px;max-width:92vw;max-height:80vh;overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,.2);animation:panelUp .3s ease;
  }
  @keyframes panelUp{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .panel-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;border-bottom:1px solid var(--border);
  }
  .panel-header h2{font-size:15px;font-weight:600}
  .panel-close{
    width:28px;height:28px;border-radius:6px;
    border:1px solid var(--border);background:none;
    color:var(--text-faint);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;transition:all .15s;
  }
  .panel-close:hover{background:#f3f4f6;color:var(--text)}
  .detail-body{padding:22px;display:flex;gap:22px}
  .detail-preview{
    width:240px;min-width:240px;aspect-ratio:4/3;
    border-radius:10px;overflow:hidden;background:#f3f4f6;
    display:flex;align-items:center;justify-content:center;
  }
  .detail-preview img{width:100%;height:100%;object-fit:cover}
  .detail-preview .icon-wrap-lg{
    width:56px;height:56px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .detail-preview .icon-wrap-lg svg{width:28px;height:28px}
  .detail-meta{flex:1;min-width:0}
  .field{margin-bottom:14px}
  .field label{
    display:block;font-size:11px;font-weight:600;
    color:var(--text-faint);text-transform:uppercase;
    letter-spacing:.06em;margin-bottom:4px;
  }
  .field .value{
    font-size:13px;color:var(--text);font-family:'Courier New',monospace;
    word-break:break-all;line-height:1.5;
  }
  .field .value.url-link{color:var(--primary);cursor:pointer}
  .field .value.url-link:hover{text-decoration:underline}
  .panel-footer{
    padding:14px 22px;border-top:1px solid var(--border);
    display:flex;align-items:center;justify-content:flex-end;gap:8px;
  }
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;font-family:inherit;
    border-radius:8px;padding:9px 16px;
    border:1px solid transparent;cursor:pointer;transition:all .15s;
  }
  .btn svg{width:15px;height:15px}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-ghost{background:transparent;color:var(--text-soft);border-color:var(--border)}
  .btn-ghost:hover{background:#f3f4f6;color:var(--text)}
  .btn-danger-ghost{background:transparent;color:var(--danger);border-color:var(--border)}
  .btn-danger-ghost:hover{background:var(--danger-soft);border-color:var(--danger)}
  .btn-sm{padding:6px 12px;font-size:12px}

  /* ===== Toast ===== */
  .toast-container{
    position:fixed;bottom:24px;right:24px;z-index:500;
    display:flex;flex-direction:column;gap:8px;
  }
  .toast{
    padding:12px 18px;border-radius:8px;
    font-size:13px;font-weight:500;color:#fff;
    display:flex;align-items:center;gap:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.15);
    animation:toastIn .3s ease;max-width:320px;
  }
  .toast.success{background:var(--success)}
  .toast.info{background:var(--primary)}
  .toast.error{background:var(--danger)}
  .toast.fade-out{animation:toastOut .3s ease forwards}
  @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  @keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
  .toast svg{width:16px;height:16px;flex:none}

  @media(max-width:960px){
    .app{grid-template-columns:1fr}
    .sidebar{display:none}
    .stats{grid-template-columns:repeat(2,1fr)}
    .tb-search{display:none}
    .content{padding:18px}
    .detail-body{flex-direction:column}
    .detail-preview{width:100%;min-width:0}
    .list-row{grid-template-columns:36px 1fr 80px}
    .col-hide{display:none}
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="mark">X</div>
      <div class="name">Xlt Admin</div>
    </div>
    <nav class="nav">

    +'<div class="uc-hint">拖放或点击</div>'

}

function thumbHTML(f){
  var c=CATS[f.cat];
  var overlay='<div class="hover-overlay"><div class="hover-actions"><button class="btn btn-sm" onclick="event.stopPropagation();showDetail('+f.id+')">详情</button><button class="btn btn-sm" onclick="event.stopPropagation();copyLink('+f.id+')">复制链接</button></div></div>';
  if(f.img) return '<div class="thumb"><img src="https://picsum.photos/seed/'+encodeURIComponent(f.name)+'/300/200" alt="">'+overlay+'</div>';
  return '<div class="thumb" style="background:'+c.color+'12"><span class="badge" style="background:'+c.color+'">'+c.code+'</span><div class="icon-wrap" style="color:'+c.color+'">'+(ICONS[f.cat]||'')+'</div>'+overlay+'</div>';
}

function renderGrid(files){
  grid.innerHTML=uploadCardHTML()+files.map(function(f){
    return '<div class="card" data-id="'+f.id+'" data-cat="'+f.cat+'">'

      +'<div class="fname" title="'+f.name+'">'+f.name+'</div>'
      +'<div class="card-meta"><span class="fsize">'+f.size+'</span><span class="fdate">2026-'+f.date+'</span></div>'
      +'<div class="card-actions"><button class="link-btn muted" onclick="event.stopPropagation();copyLink('+f.id+')">复制链接</button><button class="link-btn danger" onclick="event.stopPropagation();deleteFile('+f.id+')">删除</button></div>'
      +'</div></div>';
  }).join('');

  // bind upload card
  var uc=document.getElementById('uploadCard');
  if(uc){
    uc.addEventListener('click',function(){showToast('打开文件选择器（原型演示）','info')});
    uc.addEventListener('dragover',function(e){e.preventDefault();uc.classList.add('drag-over')});
    uc.addEventListener('dragleave',function(){uc.classList.remove('drag-over')});
    uc.addEventListener('drop',function(e){e.preventDefault();uc.classList.remove('drag-over');showToast('文件已上传','success')});
  }

  grid.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('click',function(){showDetail(parseInt(card.dataset.id))});
  });
}

function rowThumb(f){
  var c=CATS[f.cat];

  return '<div class="row-thumb" style="background:'+c.color+'12;color:'+c.color+'">'+(ICONS[f.cat]||'')+'</div>';
}

function renderList(files){

  var rows=files.map(function(f){
    return '<div class="list-row" onclick="showDetail('+f.id+')">'
      +rowThumb(f)
      +'<span class="lname" title="'+f.name+'">'+f.name+'</span>'
      +'<span class="cell-soft col-hide">'+CATS[f.cat].label+'</span>'
      +'<span class="cell-soft col-hide">'+f.size+'</span>'
      +'<span class="cell-soft col-hide">2026-'+f.date+'</span>'
      +'<span class="row-actions"><button class="link-btn muted" onclick="event.stopPropagation();copyLink('+f.id+')">复制</button><button class="link-btn danger" onclick="event.stopPropagation();deleteFile('+f.id+')">删除</button></span>'
      +'</div>';
  }).join('');
  list.innerHTML=head+rows;
}

function applyFilters(){
  var files=FILES.filter(function(f){return currentCat==='all'||f.cat===currentCat});
  if(currentQuery.trim()){
    var q=currentQuery.trim().toLowerCase();
    files=files.filter(function(f){return f.name.toLowerCase().indexOf(q)!==-1});
  }
  if(currentSort==='name') files=[].concat(files).sort(function(a,b){return a.name.localeCompare(b.name,'zh')});
  else if(currentSort==='size'){
    var num=function(s){var n=parseFloat(s);return s.indexOf('MB')!==-1?n*1024:s.indexOf('GB')!==-1?n*1048576:n};
    files=[].concat(files).sort(function(a,b){return num(b.size)-num(a.size)});
  }
  emptyState.classList.toggle('show',files.length===0);
  grid.classList.toggle('hidden',files.length===0);
  if(list.classList.contains('active')) list.style.display=files.length?'flex':'none';
  renderGrid(files);
  renderList(files);
}

document.getElementById('catChips').addEventListener('click',function(e){
  var chip=e.target.closest('.chip');if(!chip)return;
  document.querySelectorAll('.chip').forEach(function(el){el.classList.remove('active')});
  chip.classList.add('active');currentCat=chip.dataset.cat;applyFilters();
});
document.getElementById('searchInput').addEventListener('input',function(e){currentQuery=e.target.value;applyFilters()});
document.getElementById('sortSelect').addEventListener('change',function(e){currentSort=e.target.value;applyFilters()});

var gridBtn=document.getElementById('gridBtn'),listBtn=document.getElementById('listBtn');
gridBtn.addEventListener('click',function(){
  gridBtn.classList.add('active');listBtn.classList.remove('active');
  grid.classList.remove('hidden');list.classList.remove('active');
});
listBtn.addEventListener('click',function(){
  listBtn.classList.add('active');gridBtn.classList.remove('active');
  grid.classList.add('hidden');list.classList.add('active');
});

function showDetail(id){
  var f=FILES.find(function(m){return m.id===id});if(!f)return;
  var c=CATS[f.cat];
  document.getElementById('detailName').textContent=f.name;
  document.getElementById('detailType').textContent=c.label+' ('+f.cat+')';
  document.getElementById('detailSize').textContent=f.size;
  document.getElementById('detailDate').textContent='2026-'+f.date;
  document.getElementById('detailUrl').textContent='/uploads/media/'+f.name;
  if(f.img){
    document.getElementById('detailPreview').innerHTML='<img src="https://picsum.photos/seed/'+encodeURIComponent(f.name)+'/400/300" alt="">';
  } else {
    document.getElementById('detailPreview').innerHTML='<div class="icon-wrap-lg" style="background:'+c.color+'15;color:'+c.color+'">'+(ICONS[f.cat]||'')+'</div>';
  }
  document.getElementById('detailOverlay').classList.add('visible');
}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('visible')}
document.getElementById('closeDetail').addEventListener('click',closeDetail);
document.getElementById('detailOverlay').addEventListener('click',function(e){if(e.target===e.currentTarget)closeDetail()});
document.getElementById('detailCopy').addEventListener('click',function(){showToast('链接已复制到剪贴板','success');closeDetail()});
document.getElementById('detailInsert').addEventListener('click',function(){showToast('已插入到当前文章','info');closeDetail()});
document.getElementById('detailDelete').addEventListener('click',function(){showToast('文件已删除','success');closeDetail()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetail()});

function deleteFile(id){showToast('文件已删除','success')}
function copyLink(id){showToast('链接已复制到剪贴板','success')}

function showToast(msg,type){
  type=type||'info';
  var container=document.getElementById('toastContainer');
  var icon=type==='success'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':
    type==='error'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>':
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
  var t=document.createElement('div');
  t.className='toast '+type;t.innerHTML=icon+msg;
  container.appendChild(t);
  setTimeout(function(){t.classList.add('fade-out');setTimeout(function(){t.remove()},300)},2500);
}

applyFilters();
</script>
</body>
</html>
