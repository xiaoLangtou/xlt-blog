<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>评论管理 - Xlt Admin</title>
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --blue-50:#eff6ff; --blue-100:#dbeafe;
    --border:#e2e8f0; --border-light:#f1f5f9;
    --bg:#f8fafc; --card:#ffffff;
    --text:#1e293b; --text-secondary:#64748b; --text-muted:#94a3b8;
    --amber-bg:#fffbeb; --amber-text:#d97706;
    --emerald-bg:#ecfdf5; --emerald-text:#059669; --emerald-border:#a7f3d0;
    --rose-bg:#fef2f2; --rose-text:#e11d48; --rose-border:#fecdd3;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  .icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex-shrink:0;}

  .layout{display:flex;height:100vh;overflow:hidden;}

  .sidebar{width:224px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .logo{height:64px;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--border);}
  .logo-mark{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
  .logo-text{font-weight:600;font-size:15px;}
  .nav{flex:1;overflow-y:auto;padding:12px 8px;font-size:13.5px;}
  .nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--text-secondary);cursor:default;}
  .nav-item:hover{background:var(--bg);}
  .nav-group-title{display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:500;color:var(--text);}
  .nav-sub{margin-left:16px;padding-left:16px;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:2px;}
  .nav-sub-item{padding:7px 12px;border-radius:8px;color:var(--text-secondary);cursor:pointer;}
  .nav-sub-item:hover{background:var(--bg);}
  .nav-sub-item.active{background:var(--blue-50);color:var(--blue);font-weight:500;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:64px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;}
  .breadcrumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-secondary);}
  .breadcrumb .cur{color:var(--text);font-weight:500;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .search-box{position:relative;}
  .search-box input{width:220px;height:36px;padding:0 40px 0 34px;border-radius:8px;border:1px solid transparent;background:var(--bg);font-size:13px;outline:none;}
  .search-box input:focus{border-color:var(--blue);background:#fff;}
  .search-box .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);}
  .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--text-muted);border:1px solid var(--border);border-radius:4px;padding:1px 4px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#6366f1);}

  .tabbar{height:44px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 20px;overflow-x:auto;}
  .tab{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--text-secondary);white-space:nowrap;}
  .tab.active{background:var(--blue-50);color:var(--blue);font-weight:500;}

  .content{flex:1;overflow-y:auto;padding:20px;}

  .filter-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px;}
  .filter-item{display:flex;align-items:center;gap:8px;}
  .filter-label{font-size:13px;color:var(--text-secondary);white-space:nowrap;}
  .filter-bar input[type=text], .filter-bar select{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;outline:none;background:#fff;color:var(--text);}
  .filter-bar input[type=text]:focus, .filter-bar select:focus{border-color:var(--blue);}
  .filter-bar input[type=text]{width:190px;}
  .filter-bar select{width:130px;}
  .filter-bar select.wide{width:240px;}
  .spacer{margin-left:auto;display:flex;gap:8px;}

  .btn{height:34px;padding:0 14px;border-radius:8px;font-size:13px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-success{color:var(--emerald-text);border-color:var(--emerald-border);}
  .btn-success:hover{background:var(--emerald-bg);}
  .btn-danger{color:var(--rose-text);border-color:var(--rose-border);}
  .btn-danger:hover{background:var(--rose-bg);}
  .btn-sm{height:30px;padding:0 10px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn:disabled:hover{background:#fff;}
  .icon-btn{width:32px;height:32px;padding:0;justify-content:center;border:none;color:var(--text-secondary);border-radius:8px;background:none;cursor:pointer;}
  .icon-btn:hover{background:var(--bg);}
  .icon-btn.active{background:var(--blue-50);color:var(--blue);}
  .divider-v{width:1px;height:16px;background:var(--border);margin:0 6px;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border-light);}
  .selected-hint{font-size:12.5px;color:var(--blue);}
  .view-toggle{margin-left:auto;display:flex;align-items:center;gap:2px;}
  .view-btn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;border:none;background:none;cursor:pointer;}
  .view-btn.active{background:var(--bg);color:var(--text);font-weight:500;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;padding:10px 14px;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border-light);}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border-light);vertical-align:top;color:var(--text);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfc;}
  .panel.compact tbody td{padding:6px 14px;}
  .panel.compact thead th{padding:7px 14px;}
  .panel.compact .cc-content{min-height:0;}
  .panel.compact .comment-card{padding:10px;}
  .panel.hide-article .col-article{display:none;}
  .panel.hide-article .cc-article{display:none;}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;}
  .article-link{color:var(--blue);cursor:default;}
  .contact{color:var(--text-muted);font-size:12px;margin-top:2px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;white-space:nowrap;}
  .badge-pending{background:var(--amber-bg);color:var(--amber-text);}
  .badge-approved{background:var(--emerald-bg);color:var(--emerald-text);}
  .badge-rejected{background:var(--rose-bg);color:var(--rose-text);}
  .link-btn{background:none;border:none;padding:0;font-size:13px;cursor:pointer;margin-right:12px;}
  .link-blue{color:var(--blue);}
  .link-rose{color:var(--rose-text);}
  .time-cell{color:var(--text-secondary);white-space:nowrap;}
  .reply-row td{padding-top:0;}
  .reply-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;}
  .reply-box textarea{width:100%;min-height:60px;resize:vertical;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;}
  .reply-box textarea:focus{border-color:var(--blue);}
  .reply-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
  .reply-error{font-size:12px;color:var(--rose-text);margin-top:4px;display:none;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:16px;}
  .comment-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .cc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .cc-user{display:flex;align-items:center;gap:8px;}
  .cc-check{margin-top:2px;}
  .cc-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-100);color:var(--blue-dark);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
  .cc-name{font-size:13.5px;font-weight:500;}
  .cc-contact{font-size:11.5px;color:var(--text-muted);}
  .cc-content{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px;min-height:44px;}
  .cc-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border-light);padding-top:10px;}
  .cc-meta{font-size:12px;color:var(--text-muted);}
  .cc-article{font-size:12px;color:var(--blue);margin-bottom:8px;}

  .empty-state{padding:60px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;}

  .pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border-light);font-size:13px;color:var(--text-secondary);}
  .page-num{width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid var(--border);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;}
  .page-num.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .page-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;}
  .page-btn:hover{background:var(--bg);}
  .page-btn.disabled{opacity:.4;cursor:not-allowed;}

  .hidden{display:none !important;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal-box{background:#fff;border-radius:var(--radius);padding:20px;width:340px;}
  .modal-title{font-size:15px;font-weight:600;margin:0 0 8px;}
  .modal-msg{font-size:13.5px;color:var(--text-secondary);line-height:1.6;margin:0 0 18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}

  .toast-container{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{background:#1e293b;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">X</div><div class="logo-text">Xlt Admin</div></div>
    <nav class="nav">
      <div class="nav-item">仪表盘</div>
      <div class="nav-item">权限管理</div>
      <div class="nav-item">系统监控</div>
      <div class="nav-item">开发平台</div>
      <div class="nav-group-title">博客管理</div>
      <div class="nav-sub">
        <div class="nav-sub-item">文章管理</div>
        <div class="nav-sub-item">分类管理</div>
        <div class="nav-sub-item">标签管理</div>
        <div class="nav-sub-item">专栏管理</div>
        <div class="nav-sub-item active">评论管理</div>
        <div class="nav-sub-item">媒体库</div>
      </div>
      <div class="nav-item" style="margin-top:6px;">博客系统</div>
    </nav>
  </aside>

  <div class="main">

    <header class="topbar">
      <div class="breadcrumb">
        <span>博客管理</span>
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        <span class="cur">评论管理</span>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" placeholder="搜索">
          <span class="kbd">⌘K</span>
        </div>
        <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
        <div class="avatar"></div>
      </div>
    </header>

    <div class="tabbar">
      <div class="tab">仪表盘</div>
      <div class="tab">文章管理</div>
      <div class="tab active">评论管理</div>
    </div>

    <main class="content">

      <div class="filter-bar">
        <div class="filter-item">
          <span class="filter-label">评论内容</span>
          <input id="f-keyword" type="text" placeholder="请输入评论内容或用户昵称">
        </div>
        <div class="filter-item">
          <span class="filter-label">状态</span>
          <select id="f-status">
            <option>全部状态</option>
            <option>待审核</option>
            <option>已通过</option>
            <option>已拒绝</option>
          </select>
        </div>
        <div class="filter-item">
          <span class="filter-label">所属文章</span>
          <select id="f-article" class="wide">
            <option>全部文章</option>
            <option>NestJS与DrizzleORM：绝佳的搭配</option>
            <option>从 REST 到 tRPC：我们踩过的坑</option>
          </select>
        </div>
        <div class="spacer">
          <button class="btn" id="btn-reset">重置</button>
          <button class="btn btn-primary" id="btn-query">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>查询
          </button>
        </div>
      </div>

      <div class="panel" id="panel">
        <div class="toolbar">
          <button class="btn btn-success btn-sm" id="btn-batch-approve" disabled>
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>批量通过
          </button>
          <button class="btn btn-danger btn-sm" id="btn-batch-delete" disabled>
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>批量删除
          </button>
          <span class="selected-hint hidden" id="selected-hint"></span>

          <div class="view-toggle">
            <button class="icon-btn" id="btn-refresh" title="刷新"><svg class="icon" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.5 9A9 9 0 1 0 22 13"/></svg></button>
            <button class="icon-btn" id="btn-sort" title="按时间排序"><svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
            <button class="icon-btn" id="btn-density" title="紧凑模式"><svg class="icon" viewBox="0 0 24 24"><path d="M3 4h18M3 10h18M3 16h18M3 22h18"/></svg></button>
            <button class="icon-btn" id="btn-settings" title="隐藏所属文章列"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg></button>
            <span class="divider-v"></span>
            <button id="btn-view-table" class="view-btn active">
              <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>表格
            </button>
            <button id="btn-view-card" class="view-btn">
              <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>卡片
            </button>
          </div>
        </div>

        <div id="view-table">
          <table>
            <thead>
              <tr>
                <th style="width:36px;"><input type="checkbox" id="select-all"></th>
                <th>评论内容</th>
                <th class="col-article" style="width:150px;">所属文章</th>
                <th style="width:120px;">评论人</th>
                <th style="width:76px;">状态</th>
                <th style="width:120px;">时间</th>
                <th style="width:150px;">操作</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

        <div id="view-card" class="hidden">
          <div class="card-grid" id="card-body"></div>
        </div>

        <div class="pagination" id="pagination"></div>
      </div>

    </main>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

    {id:12,name:"访客1837",contact:"77.***.**.19",content:"这条评论包含无关外链，已被系统标记。",article:"NestJS与DrizzleORM：绝佳的搭配",status:"已拒绝",time:"2026-08-08 07:30"},
    {id:13,name:"夏木",contact:"xiamu***@gmail.com",content:"请教一下多租户场景下 Drizzle 的 schema 隔离一般怎么设计？",article:"NestJS与DrizzleORM：绝佳的搭配",status:"待审核",time:"2026-08-07 16:48"}
  ],
  filters:{keyword:"",status:"全部状态",article:"全部文章"},
  selected:new Set(),
  view:"table",
  sortDesc:true,
  compact:false,
  showArticle:true,
  page:1,
  pageSize:5,
  replyOpenId:null
};

var badgeClass = {"待审核":"badge-pending","已通过":"badge-approved","已拒绝":"badge-rejected"};

function getFiltered(){
  var kw = state.filters.keyword.trim();
  return state.comments.filter(function(r){
    if(kw && r.content.indexOf(kw) === -1 && r.name.indexOf(kw) === -1) return false;
    if(state.filters.status !== "全部状态" && r.status !== state.filters.status) return false;
    if(state.filters.article !== "全部文章" && r.article !== state.filters.article) return false;
    return true;
  });
}
function getSorted(arr){
  var out = arr.slice();
  out.sort(function(a,b){
    if(a.time === b.time) return 0;
    var cmp = a.time > b.time ? 1 : -1;
    return state.sortDesc ? -cmp : cmp;
  });
  return out;
}

function actionsHtml(r){
  if(r.status === "待审核"){
    return '<button class="link-btn link-blue" data-act="approve" data-id="'+r.id+'">通过</button>' +
           '<button class="link-btn link-rose" data-act="reject" data-id="'+r.id+'">驳回</button>' +
           '<button class="link-btn link-rose" data-act="delete" data-id="'+r.id+'">删除</button>';
  }
  return '<button class="link-btn link-blue" data-act="reply" data-id="'+r.id+'">回复</button>' +
         '<button class="link-btn link-rose" data-act="delete" data-id="'+r.id+'">删除</button>';
}
function replyBoxHtml(r){
  if(state.replyOpenId !== r.id) return "";
  return '<div class="reply-box">' +
    '<textarea placeholder="回复 '+r.name+'……" id="reply-input-'+r.id+'"></textarea>' +
    '<div class="reply-error" id="reply-error-'+r.id+'">请输入回复内容</div>' +
    '<div class="reply-actions">' +
      '<button class="btn btn-sm" data-act="cancel-reply" data-id="'+r.id+'">取消</button>' +
      '<button class="btn btn-primary btn-sm" data-act="send-reply" data-id="'+r.id+'">发送</button>' +
    '</div></div>';
}

function render(){
  var filtered = getFiltered();
  var sorted = getSorted(filtered);
  var total = sorted.length;
  var maxPage = Math.max(1, Math.ceil(total / state.pageSize));
  if(state.page > maxPage) state.page = maxPage;
  var start = (state.page - 1) * state.pageSize;
  var slice = sorted.slice(start, start + state.pageSize);

  renderTable(slice, total);
  renderCard(slice, total);
  renderPagination(total, maxPage);
  updateBatchUI();
  updateSelectAllCheckbox(slice);

  document.getElementById("panel").classList.toggle("compact", state.compact);
  document.getElementById("panel").classList.toggle("hide-article", !state.showArticle);
}

function renderTable(slice, total){
  var tbody = document.getElementById("table-body");
  tbody.innerHTML = "";
  if(total === 0){
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state">没有找到符合条件的评论，试试调整筛选条件</div></td></tr>';
    return;
  }
  slice.forEach(function(r){
    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td><input type="checkbox" class="row-check" data-id="'+r.id+'" '+(state.selected.has(r.id)?"checked":"")+'></td>' +
      '<td><div class="clamp2">'+r.content+'</div></td>' +
      '<td class="article-link col-article">'+r.article+'</td>' +
      '<td>'+r.name+'<div class="contact">'+r.contact+'</div></td>' +
      '<td><span class="badge '+badgeClass[r.status]+'">'+r.status+'</span></td>' +
      '<td class="time-cell">'+r.time+'</td>' +
      '<td>'+actionsHtml(r)+'</td>';
    tbody.appendChild(tr);
    if(state.replyOpenId === r.id){
      var trr = document.createElement("tr");
      trr.className = "reply-row";
      trr.innerHTML = '<td></td><td colspan="6">'+replyBoxHtml(r)+'</td>';
      tbody.appendChild(trr);
    }
  });
}

function renderCard(slice, total){
  var cbody = document.getElementById("card-body");
  cbody.innerHTML = "";
  if(total === 0){
    cbody.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">没有找到符合条件的评论，试试调整筛选条件</div>';
    return;
  }
  slice.forEach(function(r){
    var initial = r.name.slice(0,1);
    var card = document.createElement("div");
    card.className = "comment-card";
    card.innerHTML =
      '<div class="cc-head">' +
        '<div class="cc-user">' +
          '<input type="checkbox" class="row-check cc-check" data-id="'+r.id+'" '+(state.selected.has(r.id)?"checked":"")+'>' +
          '<div class="cc-avatar">'+initial+'</div>' +
          '<div><div class="cc-name">'+r.name+'</div><div class="cc-contact">'+r.contact+'</div></div>' +
        '</div>' +
        '<span class="badge '+badgeClass[r.status]+'">'+r.status+'</span>' +
      '</div>' +
      '<div class="cc-content">'+r.content+'</div>' +
      '<div class="cc-article">'+r.article+'</div>' +
      '<div class="cc-footer">' +
        '<span class="cc-meta">'+r.time+'</span>' +
        '<div>'+actionsHtml(r)+'</div>' +
      '</div>' +
      replyBoxHtml(r);
    cbody.appendChild(card);
  });
}

function renderPagination(total, maxPage){
  var el = document.getElementById("pagination");
  el.innerHTML = "";
  var countSpan = document.createElement("span");
  countSpan.textContent = "共 " + total + " 条";
  el.appendChild(countSpan);

  var prev = document.createElement("div");
  prev.className = "page-btn" + (state.page <= 1 ? " disabled" : "");
  prev.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>';
  prev.onclick = function(){ if(state.page > 1){ state.page--; render(); } };
  el.appendChild(prev);

  for(var p = 1; p <= maxPage; p++){
    (function(p){
      var num = document.createElement("div");
      num.className = "page-num" + (p === state.page ? " active" : "");
      num.textContent = p;
      num.onclick = function(){ state.page = p; render(); };
      el.appendChild(num);
    })(p);
  }

  var next = document.createElement("div");
  next.className = "page-btn" + (state.page >= maxPage ? " disabled" : "");
  next.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>';
  next.onclick = function(){ if(state.page < maxPage){ state.page++; render(); } };
  el.appendChild(next);
}

function updateBatchUI(){
  var n = state.selected.size;
  document.getElementById("btn-batch-approve").disabled = n === 0;
  document.getElementById("btn-batch-delete").disabled = n === 0;
  var hint = document.getElementById("selected-hint");
  if(n > 0){
    hint.textContent = "已选 " + n + " 项";
    hint.classList.remove("hidden");
  } else {
    hint.classList.add("hidden");
  }
}

function updateSelectAllCheckbox(slice){
  var box = document.getElementById("select-all");
  if(slice.length === 0){ box.checked = false; box.indeterminate = false; return; }
  var allChecked = slice.every(function(r){ return state.selected.has(r.id); });
  var someChecked = slice.some(function(r){ return state.selected.has(r.id); });
  box.checked = allChecked;
  box.indeterminate = someChecked && !allChecked;
}

/* toast */
function showToast(msg){
  var container = document.getElementById("toast-container");
  var t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  container.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add("show"); });
  setTimeout(function(){
    t.classList.remove("show");
    setTimeout(function(){ t.remove(); }, 200);
  }, 2200);
}

/* confirm modal */
function showConfirm(title, message, onConfirm){
  var overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML =
    '<div class="modal-box">' +
      '<p class="modal-title">'+title+'</p>' +
      '<p class="modal-msg">'+message+'</p>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-sm" id="modal-cancel">取消</button>' +
        '<button class="btn btn-danger btn-sm" id="modal-confirm">确定删除</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  overlay.querySelector("#modal-cancel").onclick = function(){ overlay.remove(); };
  overlay.addEventListener("click", function(e){ if(e.target === overlay) overlay.remove(); });
  overlay.querySelector("#modal-confirm").onclick = function(){ overlay.remove(); onConfirm(); };
}

/* selection helpers */
function toggleSelect(id, checked){
  if(checked) state.selected.add(id); else state.selected.delete(id);
}

/* delegated click handling for table + card containers */
function handleActionClick(e){
  var btn = e.target.closest("button[data-act]");
  if(!btn) return;
  var act = btn.dataset.act;
  var id = parseInt(btn.dataset.id, 10);

  if(act === "approve"){
    var r = state.comments.find(function(c){ return c.id === id; });
    r.status = "已通过";
    showToast("已通过该评论");
    render();
  } else if(act === "reject"){
    var r2 = state.comments.find(function(c){ return c.id === id; });
    r2.status = "已拒绝";
    showToast("已驳回该评论");
    render();
  } else if(act === "delete"){
    showConfirm("删除评论", "确定删除这条评论吗？该操作不可撤销。", function(){
      state.comments = state.comments.filter(function(c){ return c.id !== id; });
      state.selected.delete(id);
      showToast("已删除该评论");
      render();
    });
  } else if(act === "reply"){
    state.replyOpenId = (state.replyOpenId === id ? null : id);
    render();
  } else if(act === "cancel-reply"){
    state.replyOpenId = null;
    render();
  } else if(act === "send-reply"){
    var input = document.getElementById("reply-input-" + id);
    var errorEl = document.getElementById("reply-error-" + id);
    var val = input.value.trim();
    if(!val){
      errorEl.style.display = "block";
      return;
    }
    var target = state.comments.find(function(c){ return c.id === id; });
    uid++;
    state.comments.unshift({
      id: uid,
      name: "我",
      contact: "admin@xlt.dev",
      content: "回复 @" + target.name + "：" + val,
      article: target.article,
      status: "已通过",
      time: "2026-08-18 10:00"
    });
    state.replyOpenId = null;
    showToast("回复已发送");
    render();
  }
}
document.getElementById("table-body").addEventListener("click", handleActionClick);
document.getElementById("card-body").addEventListener("click", handleActionClick);

function handleCheckChange(e){
  if(!e.target.classList.contains("row-check")) return;
  var id = parseInt(e.target.dataset.id, 10);
  toggleSelect(id, e.target.checked);
  updateBatchUI();
  var filtered = getSorted(getFiltered());
  var start = (state.page - 1) * state.pageSize;
  updateSelectAllCheckbox(filtered.slice(start, start + state.pageSize));
}
document.getElementById("table-body").addEventListener("change", handleCheckChange);
document.getElementById("card-body").addEventListener("change", handleCheckChange);

document.getElementById("select-all").addEventListener("change", function(e){
  var filtered = getSorted(getFiltered());
  var start = (state.page - 1) * state.pageSize;
  var slice = filtered.slice(start, start + state.pageSize);
  slice.forEach(function(r){ toggleSelect(r.id, e.target.checked); });
  render();
});

document.getElementById("btn-batch-approve").addEventListener("click", function(){
  var n = 0;
  state.comments.forEach(function(c){
    if(state.selected.has(c.id) && c.status === "待审核"){ c.status = "已通过"; n++; }
  });
  state.selected.clear();
  showToast(n > 0 ? "已批量通过 " + n + " 条评论" : "所选评论中没有待审核项");
  render();
});
document.getElementById("btn-batch-delete").addEventListener("click", function(){
  var n = state.selected.size;
  showConfirm("批量删除", "确定删除选中的 " + n + " 条评论吗？该操作不可撤销。", function(){
    state.comments = state.comments.filter(function(c){ return !state.selected.has(c.id); });
    state.selected.clear();
    showToast("已删除 " + n + " 条评论");
    render();
  });
});

document.getElementById("btn-query").addEventListener("click", function(){
  state.filters.keyword = document.getElementById("f-keyword").value;
  state.filters.status = document.getElementById("f-status").value;
  state.filters.article = document.getElementById("f-article").value;
  state.page = 1;
  render();
  showToast("已筛选，共 " + getFiltered().length + " 条");
});
document.getElementById("f-keyword").addEventListener("keydown", function(e){
  if(e.key === "Enter") document.getElementById("btn-query").click();
});
document.getElementById("btn-reset").addEventListener("click", function(){
  document.getElementById("f-keyword").value = "";
  document.getElementById("f-status").value = "全部状态";
  document.getElementById("f-article").value = "全部文章";
  state.filters = {keyword:"",status:"全部状态",article:"全部文章"};
  state.page = 1;
  render();
});

document.getElementById("btn-refresh").addEventListener("click", function(){
  document.getElementById("f-keyword").value = "";
  document.getElementById("f-status").value = "全部状态";
  document.getElementById("f-article").value = "全部文章";
  state.filters = {keyword:"",status:"全部状态",article:"全部文章"};
  state.selected.clear();
  state.sortDesc = true;
  state.page = 1;
  state.replyOpenId = null;
  render();
  showToast("已刷新");
});
document.getElementById("btn-sort").addEventListener("click", function(e){
  state.sortDesc = !state.sortDesc;
  e.currentTarget.classList.toggle("active", !state.sortDesc);
  render();
  showToast(state.sortDesc ? "按时间从新到旧排序" : "按时间从旧到新排序");
});
document.getElementById("btn-density").addEventListener("click", function(e){
  state.compact = !state.compact;
  e.currentTarget.classList.toggle("active", state.compact);
  render();
});
document.getElementById("btn-settings").addEventListener("click", function(e){
  state.showArticle = !state.showArticle;
  e.currentTarget.classList.toggle("active", !state.showArticle);
  render();
});

document.getElementById("btn-view-table").addEventListener("click", function(){ setView("table"); });
document.getElementById("btn-view-card").addEventListener("click", function(){ setView("card"); });
function setView(v){
  state.view = v;
  var isTable = v === "table";
  document.getElementById("view-table").classList.toggle("hidden", !isTable);
  document.getElementById("view-card").classList.toggle("hidden", isTable);
  document.getElementById("btn-view-table").classList.toggle("active", isTable);
  document.getElementById("btn-view-card").classList.toggle("active", !isTable);
}

render();
</script>
