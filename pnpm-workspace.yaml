  '@iconify/json': ^2.2.495
  '@iconify/vue': ^5.0.1
  '@lucide/vue': ^1.23.0
  '@tanstack/vue-table': ^8.21.3
  '@types/fs-extra': ^11.0.4
  '@unocss/core': ^66.7.4
  '@unocss/eslint-plugin': ^66.7.4
  '@vueuse/components': ^14.3.0
  '@vueuse/core': ^14.3.0
  axios: ^1.18.1
  boxen: ^8.0.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  defu: ^6.1.7
  es-toolkit: ^1.49.0
  filesize: ^11.0.19
  fs-extra: ^11.3.6
  hotkeys-js: ^4.0.4
  picocolors: ^1.1.1
  reka-ui: ^2.10.1
  tailwind-merge: ^3.6.0
  tsx: ^4.23.0
  type-fest: ^5.7.0
  unocss: ^66.7.4
  unocss-preset-animations: ^1.3.0
