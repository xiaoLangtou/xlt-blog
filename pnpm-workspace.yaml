  prettier: ^3.9.6
  '@tiptap/extension-table': ^3.30.1
  '@tiptap/extension-find-and-replace': 3.30.1
  '@tiptap/pm': 3.30.1
  sanitize-html: ^2.17.7
  '@types/sanitize-html': ^2.16.1
