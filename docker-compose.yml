services:
  mysql:
    image: mysql:8.4
    container_name: xlt-blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xlt_blog
      MYSQL_USER: xlt_blog
      MYSQL_PASSWORD: xlt_blog
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
